map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https https;
}
# Keep application routes out of search results without blocking the public page.
map $request_uri $rantevia_robots {
    default "";
    ~^/(login|home|user-admin|app|billing)([/?]|$) "noindex, nofollow";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    add_header X-Robots-Tag $rantevia_robots always;
    etag off;
    if_modified_since off;

    location /api/ {
        proxy_pass http://api:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
    }
    location = /health {
        proxy_pass http://api:4001/health;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
