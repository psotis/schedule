# Keep application routes out of search results without blocking the public page.
map $request_uri $rantevia_robots {
    default "";
    ~^/(login|home|user-admin|app)([/?]|$) "noindex, nofollow";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    add_header X-Robots-Tag $rantevia_robots always;
    etag off;
    if_modified_since off;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
